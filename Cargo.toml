[package]
name = "wtfren"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
futures = "0.3.34"
iced = { version = "0.14", features = ["tokio", "advanced", "markdown"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "rt-multi-thread", "time"] }
two-face = { version = "0.5", features = ["syntect-fancy"] }

[profile.dev.package."*"]
opt-level = 2
